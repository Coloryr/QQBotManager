<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6cff"/>
      <stop offset="1" stop-color="#4a52e8"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eaf6"/>
    </linearGradient>
  </defs>

  <!-- 底板：与界面主色一致的圆角方块 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 天线 -->
  <rect x="497" y="230" width="30" height="130" rx="15" fill="#ffffff" opacity="0.9"/>
  <circle cx="512" cy="210" r="42" fill="#ffd166"/>

  <!-- 侧耳 -->
  <rect x="216" y="480" width="56" height="140" rx="28" fill="#ffffff" opacity="0.85"/>
  <rect x="752" y="480" width="56" height="140" rx="28" fill="#ffffff" opacity="0.85"/>

  <!-- 头部 -->
  <rect x="252" y="340" width="520" height="400" rx="110" fill="url(#head)"/>

  <!-- 眼睛 -->
  <circle cx="404" cy="510" r="44" fill="#3a3f6e"/>
  <circle cx="620" cy="510" r="44" fill="#3a3f6e"/>
  <circle cx="418" cy="494" r="14" fill="#ffffff"/>
  <circle cx="634" cy="494" r="14" fill="#ffffff"/>

  <!-- 嘴 -->
  <rect x="452" y="616" width="120" height="26" rx="13" fill="#3a3f6e"/>
</svg>
